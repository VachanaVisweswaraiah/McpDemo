[project]
name = "mcpdemo"
version = "0.1.0"
description = "Model Context Protocol demos for server tools, clients, and LangChain orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain-mcp-adapters>=0.1.13",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.4",
    "mcp-use>=1.6.0",
    "mcp[cli]>=1.26.0",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
